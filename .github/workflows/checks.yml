name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
      - name: Install locked development tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - name: Offline Windows regressions
        run: python -m unittest discover -v
      - name: Audit Windows runtime
        run: pip-audit --disable-pip --no-deps -r requirements.lock
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Filter '*.ps1' | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { throw $parseErrors }
          }
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install contributed port and build unsigned launcher
        working-directory: macos
        run: PYTHON=python bash install-macos.sh
      - name: Install locked development tools
        run: macos/.venv/bin/python -m pip install --require-hashes -r requirements-dev.txt
      - run: macos/.venv/bin/python -m pip check
      - name: macOS regressions and actual process control
        working-directory: macos
        env:
          PYNPUT_BACKEND: dummy
        run: .venv/bin/python -m unittest discover -v
      - name: Audit macOS runtime
        run: macos/.venv/bin/pip-audit --disable-pip --no-deps -r macos/requirements.lock
      - name: Validate scripts and bundle metadata
        working-directory: macos
        run: |
          for script in *.sh *.command Dictate.app/Contents/MacOS/Dictate; do bash -n "$script"; done
          plutil -lint Dictate.app/Contents/Info.plist
          test -x Dictate.app/Contents/MacOS/Dictate
